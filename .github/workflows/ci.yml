name: Validate V0.2
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # Exercise a project-site subpath so a root-only build cannot mask broken asset URLs.
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Reproducible benchmark smoke run
        run: npm run benchmark
        env:
          BENCH_SEEDS: 6
          BENCH_YEARS: 8
          BENCH_OUTPUT: test-results/benchmark-smoke.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
