name: Validate V0.3.1
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    # Exercise a project-site subpath so a root-only build cannot mask broken asset URLs.
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Reproducible benchmark smoke run
        run: npm run benchmark:lifetime
        env:
          BENCH_SEEDS: 4
          BENCH_YEARS: 30
          BENCH_OUTPUT: test-results/benchmark-smoke.json
      - name: Compare 1x, 20x and 100x numerical results
        run: npm run benchmark:speed
        env:
          SPEED_BENCH_OUTPUT: test-results/speed-benchmark.json
      - name: Compare planetary initial distributions
        run: npm run benchmark:planet
        env:
          PLANET_INITIAL_SEEDS: 64
          PLANET_BENCH_SEEDS: 4
          PLANET_BENCH_YEARS: 10
          PLANET_BENCH_OUTPUT: test-results/planet-benchmark.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
